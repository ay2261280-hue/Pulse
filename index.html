<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name - Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Space Grotesk',sans-serif;background:#0a0a14;color:#e6e6f0;overflow-x:hidden}
  .glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:0.25;z-index:-1}
  .g1{background:#7c3aed;top:-100px;left:-100px} .g2{background:#ec4899;bottom:-100px;right:-100px}
  nav{display:flex;justify-content:space-between;padding:24px 8%;align-items:center}
  nav a{color:#aaa;text-decoration:none;margin-left:24px;font-size:14px} nav a:hover{color:white}
  .hero{display:flex;flex-wrap:wrap;padding:60px 8%;align-items:center;gap:40px}
  .hero-left{flex:1;min-width:300px}
  .badge{border:1px solid #2a2a4a;padding:6px 14px;border-radius:20px;font-size:12px;color:#a78bfa;background:rgba(124,58,237,0.1)}
  h1{font-size:56px;line-height:1;margin:20px 0 10px} .grad{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:#9ca3af;max-width:500px;line-height:1.6;margin-bottom:28px}
  .btn{padding:12px 24px;border-radius:10px;border:none;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-p{background:#7c3aed;color:white} .btn-s{background:#1a1a2e;color:white;border:1px solid #2a2a4a;margin-left:10px}
  .card-glass{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(12px);border-radius:20px;padding:20px;flex:1;min-width:250px}
  .projects{padding:40px 8%;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .project{padding:24px;border-radius:16px;background:#12121f;border:1px solid #23233a;transition:.3s}
  .project:hover{transform:translateY(-6px);border-color:#7c3aed}
  .project h3{margin:14px 0 8px} .project p{color:#9ca3af;font-size:14px}
  .tags{margin-top:12px} .tags span{font-size:11px;background:#1e1e33;border:1px solid #2d2d4a;padding:4px 8px;border-radius:6px;margin-right:6px;color:#a5b4fc}
  .skills{padding:20px 8% 60px;text-align:center}
  .skills-list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:20px}
  .skills-list span{background:#151528;border:1px solid #2a2a4a;padding:8px 16px;border-radius:10px;font-size:14px}
  footer{padding:24px 8%;border-top:1px solid #1e1e30;display:flex;justify-content:space-between;color:#666;font-size:13px}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<nav>
  <strong style="letter-spacing:1px">AR
